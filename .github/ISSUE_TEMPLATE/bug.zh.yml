name: 🐞 报告错误
description: 报告一个错误。中文用户可使用此表单。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽时间填写这份 issue。请先为这个 issue 拟一个简练、得体的标题，填入标题框，然后依次填写下面的表单。
        _带 * 的内容为必填项；其余可按实际情况填写。_

  - type: checkboxes
    id: check-answer
    attributes:
      label: 自查步骤
      description: 请认真检查并逐项确认以下内容。实际情况与必选项不符的 issue 可能会被关闭。
      options:
        - label: 我已搜索过 [Issue 列表](https://github.com/any-listen/any-listen/issues?q=is%3Aissue+)和[讨论区](https://github.com/any-listen/any-listen/discussions)，没有找到类似内容。
          required: true
        - label: 我已使用最新测试版 (Beta) 测试，问题并未解决。
          required: true
        - label: 我确保这个 issue 只提及一个问题。如果我有多个问题报告，我会分别提交。
          required: true
        - label: 我知悉，如果没有认真检查这些步骤，没有认真撰写 issue 的话，我的 issue 可能会被关闭。
          required: true
        - label: 我同意遵守项目的[行为准则](https://github.com/any-listen/any-listen/blob/main/docs/CODE_OF_CONDUCT_zh.md)。
          required: true

  - type: dropdown
    id: check-app-type
    attributes:
      label: 应用类型
      description: 你遇到问题的 Any Listen 是哪个版本？
      options:
        - 桌面版
        - Web 服务版
        - 桌面版与 Web 服务版
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为与预期行为
      description: |
        对实际发生的事情与预期行为的清晰简明描述。
        请同时提供复现步骤，例如：
        1. 前往「...」
        2. 点击「...」
        3. 出现错误
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Any Listen 版本
      description: 你使用什么版本的 Any Listen？
      placeholder: 例如 0.7.0
    validations:
      required: true
  - type: input
    id: last-known-working-version
    attributes:
      label: 最后正常的版本
      description: 如果有，请在此处填写最后正常的版本
      placeholder: 例如 0.6.0
  - type: input
    id: operating-system-version
    attributes:
      label: 操作系统版本
      description: |
        你使用什么版本的操作系统？
        在 macOS 上，单击「Apple 菜单 > 关于本机」；
        在 Linux 上，执行 `lsb_release` 或 `uname -a` 命令；
        在 Windows 上，单击「开始按钮 > 设置 > 系统 > 关于」
      placeholder: '例如 Windows 11 版本 25H2、macOS 27.0 或 Ubuntu 26.04'
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: 附加信息
      description: 如果你的问题需要进一步解释，或者你所遇到的问题不容易重现，请在此处添加更多信息。(直接把图片/视频拖到编辑框即可添加图片/视频)
