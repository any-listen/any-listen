name: ✨ Feature request
description: Suggest an idea for this project.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue. Please write a concise and appropriate title for this issue in the title field, and then fill out the form below step by step.
        _Contents marked with an asterisk (*) are required; others are optional._

  - type: checkboxes
    id: check-answer
    attributes:
      label: Self-review steps
      description: Review the following items carefully and confirm each one. Issues where the actual situation does not match the required items may be closed.
      options:
        - label: I searched on [Issue list](https://github.com/any-listen/any-listen/issues?q=is%3Aissue+) and [Discussions](https://github.com/any-listen/any-listen/discussions), no duplicate or related open contents has been found.
          required: true
        - label: I tried the latest Beta version, but this feature has not been implemented.
          required: true
        - label: I ensure that this issue contains only one feature topic. If there are multiple topics, I will create separate issues for each one.
          required: true
        - label: I realize that if I do not carefully review these steps and write the issue description thoroughly, my issue may be closed.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/any-listen/any-listen/blob/main/CODE_OF_CONDUCT.md).
          required: true

  - type: dropdown
    id: check-app-type
    attributes:
      label: App type
      description: Which edition of Any Listen is this feature request for?
      options:
        - Desktop
        - Web server
        - Both (Desktop & Web server)
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description and expected solution
      description: Clearly describe your problem and expected solution.
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add more details here if your request needs further explanation or you want to share anything else. (You can drag images/videos directly into the editor)
