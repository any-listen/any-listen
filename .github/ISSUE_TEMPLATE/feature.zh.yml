name: ✨ 功能请求
description: 为这个项目提出一个想法。中文用户可使用此表单。
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽时间填写这份 issue。请先为这个 issue 拟一个简练、得体的标题，填入标题框，然后依次填写下面的表单。
        _带 * 的内容为必填项；其余可按实际情况填写。_

  - type: checkboxes
    id: check-answer
    attributes:
      label: 自查步骤
      description: 请认真检查并逐项确认以下内容。实际情况与必选项不符的 issue 可能会被关闭。
      options:
        - label: 我已搜索过 [Issue 列表](https://github.com/any-listen/any-listen/issues?q=is%3Aissue+)和[讨论区](https://github.com/any-listen/any-listen/discussions)，没有找到类似内容。
          required: true
        - label: 我已使用最新测试版 (Beta) 测试，功能并未实现。
          required: true
        - label: 我确保这个 issue 只提及一个功能。如果我有多个功能请求，我会分别提交。
          required: true
        - label: 我知悉，如果没有认真检查这些步骤，没有认真撰写 issue 的话，我的 issue 可能会被关闭。
          required: true
        - label: 我同意遵守项目的[行为准则](https://github.com/any-listen/any-listen/blob/main/docs/CODE_OF_CONDUCT_zh.md)。
          required: true

  - type: dropdown
    id: check-app-type
    attributes:
      label: 应用类型
      description: 你提的功能请求是针对 Any Listen 的哪个版本的？
      options:
        - 桌面版
        - Web 服务版
        - 桌面版与 Web 服务版
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述与想要的解决方案
      description: 请清晰简洁地描述你的问题，以及你期望的解决方案。
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: 附加信息
      description: 如果你的问题需要进一步解释，或者想要表达其他内容，请在此处添加更多信息。(直接把图片/视频拖到编辑框即可添加图片/视频)
